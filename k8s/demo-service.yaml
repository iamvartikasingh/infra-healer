apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  namespace: demo
  labels: {app: demo-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-service}
  template:
    metadata:
      labels: {app: demo-service}
    spec:
      containers:
        - name: demo-service
          image: demo-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: DEMO_ENDPOINTS_ENABLED, value: "true"}
            - {name: MAX_LEAK_MB, value: "512"}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}   # low on purpose so /leak OOMKills fast
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: state, mountPath: /state}
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-service
  namespace: demo
spec:
  selector: {app: demo-service}
  ports: [{port: 80, targetPort: 8080}]
